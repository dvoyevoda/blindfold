<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Blindfold bandana icon</title>
  <desc id="description">A black cloth blindfold with a side knot and two loose tails on a pearl-white tile.</desc>
  <defs>
    <path id="tile" d="M330 64h364c183 0 266 83 266 266v364c0 183-83 266-266 266H330C147 960 64 877 64 694V330C64 147 147 64 330 64Z"/>
    <path id="band" d="M179 439c11-17 46-18 85-13 105 15 212-19 320-3 49 8 92 16 134 43 21 15 21 48 3 66-30 23-87 36-143 42-136 14-189-24-301-6-53 9-87-2-101-21-10-17-7-87 3-108Z"/>
    <linearGradient id="pearl" x1="190" y1="89" x2="851" y2="945" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fcfdff"/>
      <stop offset=".48" stop-color="#edf0f4"/>
      <stop offset="1" stop-color="#cbd1da"/>
    </linearGradient>
    <radialGradient id="top-light" cx="336" cy="111" r="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="204" y1="72" x2="801" y2="951" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aeb7c4" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#d4dae3" stop-opacity=".54"/>
      <stop offset="1" stop-color="#a4aebb" stop-opacity=".82"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop stop-color="#41495a" stop-opacity=".27"/>
      <stop offset="1" stop-color="#41495a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="294" y1="408" x2="392" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37383d"/>
      <stop offset=".51" stop-color="#1d1e22"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="tail" x1="827" y1="385" x2="713" y2="656" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33343a"/>
      <stop offset=".52" stop-color="#1f2024"/>
      <stop offset="1" stop-color="#0e0f12"/>
