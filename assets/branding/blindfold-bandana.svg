  <use href="#band" y="8" fill="#08090b" opacity=".17"/>
  <use href="#band" fill="url(#cloth)" stroke="#121316" stroke-width="3"/>
  <path d="M193 455c52-14 107 7 169-3 116-20 211-18 329 24"
