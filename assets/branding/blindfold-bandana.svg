      <stop offset="1" stop-color="#8d8e97" stop-opacity=".07"/>
    </linearGradient>
  </defs>

  <use href="#tile" fill="url(#pearl)"/>
  <use href="#tile" fill="url(#top-light)"/>
  <use href="#tile" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <ellipse cx="511" cy="594" rx="365" ry="100" fill="url(#shadow)"/>

  <path d="M715 466c44-45 96-61 156-55-15 20-22 38-21 58-48-3-84 16-116 47Z" fill="url(#tail)"/>
  <path d="M722 503c59 14 81 78 133 127-25 9-45 23-60 44-46-33-60-84-93-127Z" fill="url(#tail)"/>
  <path d="M747 469c35-24 59-35 91-39m-88 113c29 25 50 68 78 90"
